<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - E-commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">ShopEase</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">Deals</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="cart-icon">🛒 <span id="cart-count">0</span></div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Discover Your Style</h1>
    <p>Trendy products at unbeatable prices</p>
    <button class="cta">Shop Now</button>
  </section>

  <!-- Product Grid -->
  <section class="products">
    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Product Name</h3>
      <p>$29.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Product Name</h3>
      <p>$49.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>
    <!-- Add more product cards -->
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
